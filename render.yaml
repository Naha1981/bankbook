services:
  - type: web
    name: bankbook-brain
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /docs
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: bankbook-db
          property: connectionString

databases:
  - name: bankbook-db
    plan: free
    databaseName: bankbook
    user: bankbook
